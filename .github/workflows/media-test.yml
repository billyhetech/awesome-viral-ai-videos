name: media-test

on:
  pull_request:
    paths: [media/**, scripts/merge_videos.py, scripts/push_repo.sh, tests/**]
  push:
    branches: [master]
    paths: [media/**, scripts/merge_videos.py, scripts/push_repo.sh, tests/**]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
